language = "C"
header = "/* quepaxa C ABI. Generated by cbindgen from crates/quepaxa-ffi; do not edit. SPDX-License-Identifier: MIT OR Apache-2.0 */"
include_guard = "QUEPAXA_H"
after_includes = """
// Contract:
// - Functions return a QPX_* status: 0 ok, positive informational, negative error.
// - A handle may move between threads, but calls on one handle must not overlap.
// - Pointers from qpx_poll / qpx_action_* borrow from the handle until its next call.
// - After a mutating call, drain qpx_poll until QPX_EMPTY before the next mutating call.
// - Execute actions in order. A QPX_ACTION_PERSIST must be durable (after all earlier
//   ones) before its `then` messages are sent and qpx_persisted is called.
// - Every start (including restarts) needs a fresh CSPRNG seed in qpx_config.seed.
// - A library panic returns QPX_ERR_PANIC and poisons the handle (QPX_ERR_POISONED)."""
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true
style = "type"

[export]
include = ["qpx_action", "qpx_entry"]

[enum]
prefix_with_name = true

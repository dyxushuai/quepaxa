[package]
name = "quepaxa-ffi"
description = "Stable C ABI for the QuePaxa consensus core: an embeddable replicated log for C, C++, Go, Swift and other FFI languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/quepaxa-ffi"
categories = ["algorithms", "api-bindings", "database-implementations"]
keywords = ["consensus", "paxos", "ffi", "c-abi", "replication"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bytes = "1.12"
quepaxa = { path = "../quepaxa", version = "0.3.3" }

[lints]
workspace = true

[package]
name = "quepaxa"
description = "QuePaxa consensus for state machine replication: a sans-IO, no_std replicated log that, unlike Raft or Multi-Paxos, never stalls on election timeouts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/quepaxa"
categories = ["algorithms", "database-implementations", "no-std"]
keywords = ["consensus", "paxos", "raft", "replication", "distributed"]

[lints]
workspace = true

[features]
# Test support only: makes `Replica` cloneable and fingerprintable for model checking.
# Not part of the stable API.
model = []

[dependencies]
bytes = { version = "1.12", default-features = false }

[dev-dependencies]
bolero = "0.13"
bytes = "1.12"
criterion = { version = "0.8", default-features = false }
proptest = "1.12"

[[bench]]
name = "replica"
harness = false

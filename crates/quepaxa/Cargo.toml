[package]
name = "quepaxa"
description = "QuePaxa consensus as a sans-IO, no_std replicated log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["algorithms", "no-std"]
keywords = ["consensus", "paxos", "quepaxa", "replication", "sans-io"]

[lints]
workspace = true

[features]
# Test support only: makes `Replica` cloneable and fingerprintable for model checking.
# Not part of the stable API.
model = []

[dependencies]
bytes = { version = "1.12", default-features = false }

[dev-dependencies]
bolero = "0.13"
bytes = "1.12"
criterion = { version = "0.8", default-features = false }
proptest = "1.12"

[[bench]]
name = "replica"
harness = false

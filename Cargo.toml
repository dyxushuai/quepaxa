[workspace]
resolver = "3"
members = ["crates/*", "examples/kv-tokio"]

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dyxushuai/quepaxa"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Used by `cargo bolero test` (nightly fuzzing): optimized, with debug assertions.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

# Mutation testing runs the whole workspace per mutant, simulations and model checking
# included: optimized, with debug assertions and overflow checks kept.
[profile.mutants]
inherits = "dev"
opt-level = 3
debug = false

# For profilers (perf, samply): release code with line tables; build with
# RUSTFLAGS="-C force-frame-pointers=yes" for cheap, reliable stacks.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

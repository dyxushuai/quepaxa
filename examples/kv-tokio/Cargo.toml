[package]
name = "kv-tokio"
description = "Reference runtime for quepaxa: TCP transport, fsync'd file storage and a toy KV store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "1.12"
crc32fast = "1.5"
getrandom = "0.4"
mimalloc = { version = "0.1.52", default-features = false }
quepaxa = { path = "../../crates/quepaxa" }
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# etcd v3 KV gRPC front end (src/grpc.rs); pinned to releases at least two weeks old.
prost = "0.14.4"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "server", "channel", "transport"] }
tonic-prost = "0.14.6"
# Systematic thread-schedule exploration for the writer handoff (src/node/shuttle_tests.rs);
# only built with the `shuttle` feature, which swaps `std::sync` for it (src/sync.rs).
shuttle = { version = "=0.9.8", optional = true }

[features]
shuttle = ["dep:shuttle"]

[dev-dependencies]
# Simulated network and clock for the peer link and client pipeline tests (src/turmoil_tests.rs).
turmoil = "=0.7.2"

[build-dependencies]
# Compiles proto/ without a system protoc.
protox = "0.10.0"
tonic-prost-build = { version = "0.14.6", default-features = false, features = ["transport"] }

[lints]
workspace = true

name: Nightly assurance

on:
  schedule:
    - cron: "17 3 * * *" # nightly
    - cron: "41 4 * * 0" # weekly (Sunday): adds mutation testing
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - codec::tests::decode_never_panics_on_arbitrary_input
          - codec::tests::decode_never_panics_on_mutated_valid_messages
          - batch::tests::decode_never_panics
          - durable::tests::decode_never_panics
          - core_state::tests::decode_never_panics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bolero
      - name: Fuzz for 20 minutes (libFuzzer + ASan)
        # The prebuilt cargo-bolero defaults to its own (musl) target; ASan needs the gnu one.
        run: cargo bolero test -p quepaxa '${{ matrix.target }}' --target x86_64-unknown-linux-gnu -T 20min
      - name: Keep the corpus and any crash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ strategy.job-index }}
          path: crates/quepaxa/src/**/__fuzz__/
          if-no-files-found: ignore

  simulation:
    # 100k seeds per scenario take hours on one core: each shard runs every 8th seed on all
    # of its cores.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: 100k seeds per simulator scenario (shard ${{ matrix.shard }}/8)
        env:
          QPX_SIM_SEEDS: "100000"
          QPX_SIM_SHARD: ${{ matrix.shard }}/8
        run: cargo nextest run --release -p quepaxa-sim --test replica_sim --no-fail-fast

  deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Model checking with one more deviation per scenario, exhaustively
        env:
          QPX_MODEL_EXTRA_DEVIATIONS: "1"
          QPX_MODEL_STATES: "200000000"
        run: cargo nextest run --release -p quepaxa-sim --test model_check --no-fail-fast
      - name: Deep property tests
        if: success() || failure()
        env:
          PROPTEST_CASES: "100000"
        run: cargo nextest run --release -p quepaxa --no-fail-fast

  tla:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC simulation of the independent model, then its seeded bugs
        env:
          TLA_SECONDS: "1200"
          TLA_BUG_SECONDS: "300"
        run: verification/tla/run.sh

  bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both commits are measured in this job, on this machine: comparing against a
      # baseline recorded on another runner mostly measures the hardware difference.
      - name: Compare with the last successful nightly's commit (fail on a >10% regression)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --status success \
            -L 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$prev" ] || [ "$prev" = "$GITHUB_SHA" ] || ! git cat-file -e "$prev:crates/quepaxa/benches/replica.rs" 2>/dev/null; then
            echo "no earlier commit to compare with; measuring this one only"
            cargo bench -p quepaxa --bench replica
            exit 0
          fi
          git worktree add -q ../previous "$prev"
          (cd ../previous && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench -p quepaxa --bench replica -- --save-baseline previous)
          cargo bench -p quepaxa --bench replica -- --baseline previous --noise-threshold 0.10 | tee bench.txt
          if grep -q "Performance has regressed" bench.txt; then
            echo "::error::benchmark regression above 10% against $prev"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Coverage (reported, not gated)
        run: |
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  mutants:
    if: github.event.schedule == '41 4 * * 0' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Mutation testing of the core (shard ${{ matrix.shard }}/8)
        run: |
          # Exit 0: all caught, 2: some missed, 3: some timed out — findings, reported below.
          # Anything else (baseline failure, usage error, crash) means no valid run.
          # A mutant can allocate without bound (an emit loop that never advances); a 4 GiB
          # address-space cap per process makes its test crash instead of OOM-killing the runner.
          ulimit -v 4194304
          status=0
          cargo mutants -p quepaxa --test-tool nextest --shard ${{ matrix.shard }}/8 --no-shuffle || status=$?
          case $status in 0|2|3) ;; *) echo "::error::cargo-mutants failed (exit $status)"; exit 1 ;; esac
          test -f mutants.out/outcomes.json
          { echo "### Mutants shard ${{ matrix.shard }}"; for f in caught missed timeout unviable; do
              echo "- $f: $(wc -l < mutants.out/$f.txt 2>/dev/null || echo 0)"; done; } >> "$GITHUB_STEP_SUMMARY"
      - name: No missed mutant beyond the accepted list
        run: verification/mutants-check.sh mutants.out/missed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out/

  report:
    needs: [fuzz, simulation, deep, tla, bench, coverage, mutants]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --label needs-triage \
            --title "Nightly assurance failed ($(date -u +%F))" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Failing seeds, schedules and fuzz inputs are in the job logs and artifacts (simulator and model-checker failures print the seed or schedule that reproduces them)."

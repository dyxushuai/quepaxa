name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'README.md' # its code blocks are doctests
              - 'deny.toml'
              - 'verification/**'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs build without warnings (docs.rs)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --no-fail-fast --no-tests=pass -E 'not binary(model_check)'
      - run: cargo test --workspace --doc
      - name: The documented examples run (they assert their results)
        run: for e in cluster restart membership; do cargo run -q -p quepaxa --example "$e"; done
      - name: Model checking (release build; every scenario must be exhausted)
        run: cargo nextest run --release -p quepaxa-sim --test model_check --no-fail-fast

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  no-std:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p quepaxa --target thumbv7em-none-eabihf

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  ffi:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - name: Header is up to date
        run: |
          cbindgen --config crates/quepaxa-ffi/cbindgen.toml --crate quepaxa-ffi --output crates/quepaxa-ffi/include/quepaxa.h
          git diff --exit-code crates/quepaxa-ffi/include/quepaxa.h
      - run: cargo build --release -p quepaxa-ffi
      - name: Exported symbols are unchanged
        run: |
          nm -D --defined-only target/release/libquepaxa_ffi.so | awk '$2=="T"{print $3}' | grep '^qpx_' | sort > /tmp/symbols.txt
          diff -u crates/quepaxa-ffi/symbols.txt /tmp/symbols.txt
      - name: Header compiles as C and C++
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I crates/quepaxa-ffi/include -x c crates/quepaxa-ffi/include/quepaxa.h
          c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -I crates/quepaxa-ffi/include -x c++ crates/quepaxa-ffi/include/quepaxa.h
      - name: C smoke test under ASan/UBSan
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I crates/quepaxa-ffi/include \
            crates/quepaxa-ffi/examples/smoke.c target/release/libquepaxa_ffi.a -lpthread -ldl -lm -o smoke
          ./smoke

  miri:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p quepaxa-ffi

  tier1:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Model checking runs once, in release, in the `test` job.
      - run: cargo nextest run --workspace --no-fail-fast --no-tests=pass -E 'not binary(model_check)'
      - run: cargo test --workspace --doc
      - name: C smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --release -p quepaxa-ffi
          extra=$([ "$RUNNER_OS" = Linux ] && echo "-ldl" || true)
          cc -std=c11 -Wall -Wextra -Werror -I crates/quepaxa-ffi/include crates/quepaxa-ffi/examples/smoke.c \
            target/release/libquepaxa_ffi.a -lpthread -lm $extra -o smoke
          ./smoke

  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p quepaxa --target wasm32-unknown-unknown

  android:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Use NDK r28+ (16 KB page alignment) for every cargo-ndk step
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build the C ABI for device and emulator ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 --platform 24 build --release -p quepaxa-ffi
      - name: Build the FFI test binary and the C smoke test for the emulator
        run: |
          cargo ndk -t x86_64 --platform 24 test -p quepaxa-ffi --test c_abi --no-run
          find target/x86_64-linux-android/debug/deps -maxdepth 1 -type f -executable -name 'c_abi-*' | head -1 > test-binary.txt
          test -s test-binary.txt && cat test-binary.txt
          cc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          "$cc" -std=c11 -Wall -Wextra -Werror -I crates/quepaxa-ffi/include crates/quepaxa-ffi/examples/smoke.c \
            target/x86_64-linux-android/release/libquepaxa_ffi.a -lm -ldl -o smoke-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb push "$(cat test-binary.txt)" /data/local/tmp/c_abi && adb shell chmod +x /data/local/tmp/c_abi && adb shell /data/local/tmp/c_abi
            adb push smoke-android /data/local/tmp/smoke && adb shell chmod +x /data/local/tmp/smoke && adb shell /data/local/tmp/smoke

  ios:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p quepaxa-ffi --target aarch64-apple-ios
      - name: Smoke test on the simulator
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo build --release -p quepaxa-ffi --target aarch64-apple-ios-sim
          xcrun -sdk iphonesimulator clang -arch arm64 -mios-simulator-version-min=15.0 -std=c11 -Wall -Wextra -Werror \
            -I crates/quepaxa-ffi/include crates/quepaxa-ffi/examples/smoke.c \
            target/aarch64-apple-ios-sim/release/libquepaxa_ffi.a -o smoke-ios
          bin=$(cargo test -p quepaxa-ffi --test c_abi --target aarch64-apple-ios-sim --no-run --message-format=json \
            | jq -rR 'fromjson? | select(.reason == "compiler-artifact" and .profile.test == true) | .executable' | grep c_abi)
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" "$bin"
          xcrun simctl spawn "$udid" "$PWD/smoke-ios"

  semver:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check the Rust API against the latest real release
        run: |
          latest=$(curl -fsS -A "quepaxa-ci (github.com/dyxushuai/quepaxa)" https://crates.io/api/v1/crates/quepaxa | jq -r '.crate.max_stable_version // .crate.max_version')
          # 0.1.0 is a name placeholder with an unrelated API; checks start with 0.2.0.
          if [ "$(printf '%s\n0.2.0\n' "$latest" | sort -V | head -1)" != "0.2.0" ]; then
            echo "no real release yet (latest $latest); skipping"
            exit 0
          fi
          cargo semver-checks -p quepaxa --baseline-version "$latest"

  canaries:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Every seeded bug is still caught (verification/canaries.sh)
        run: verification/canaries.sh

  ci-ok:
    if: always()
    needs: [changes, lint, test, msrv, no-std, deny, ffi, miri, tier1, wasm, android, ios, semver, canaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: lint, test, msrv, no-std, deny, ffi, miri, tier1, wasm, android, ios, semver, canaries
          jobs: ${{ toJSON(needs) }}

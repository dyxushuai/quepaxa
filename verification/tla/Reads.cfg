\* Membership.cfg's configuration with one read: three configured members out of four
\* replicas and a change that removes two of them, so a reader may ask removed but live
\* recorders. Too large to exhaust: run.sh simulates it.
CONSTANTS
    Replicas = {1, 2, 3, 4}
    InitMembers = {1, 2, 3}
    Changes = {{3, 4}}
    N = 3
    LAG = 2
    ReadIds = {1}
SPECIFICATION RSpec
INVARIANTS ReadSafe MarkOrder TypeOK

\* Membership.cfg's configuration with one read and a permanent observer (replica 5, never
\* in InitMembers or Changes): three configured members out of five replicas and a change
\* that removes two of them, so both members and the observer read across reconfigurations
\* and retirements. Too large to exhaust: run.sh simulates it.
CONSTANTS
    Replicas = {1, 2, 3, 4, 5}
    InitMembers = {1, 2, 3}
    Changes = {{3, 4}}
    N = 3
    LAG = 2
    Rotate = FALSE
    ReadIds = {1}
SPECIFICATION RSpec
INVARIANTS ReadSafe MarkOrder ObserverNoRegisters TypeOK

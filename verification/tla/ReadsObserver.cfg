\* Fixed membership with a permanent non-voting observer (`obs` not in `InitMembers`):
\* `obs` never records registers and never decides slots, yet follows the log and serves
\* linearizable reads across slots and compaction. Checked exhaustively; Reads.cfg also
\* simulates a 3-voter cluster + permanent observer across membership changes.
CONSTANTS
    Replicas = {m1, m2, obs}
    InitMembers = {m1, m2}
    Changes = {}
    N = 2
    LAG = 2
    Rotate = FALSE
    ReadIds = {1}
SPECIFICATION RSpec
INVARIANTS ReadSafe MarkOrder ObserverNoRegisters TypeOK
SYMMETRY MemberSymmetry

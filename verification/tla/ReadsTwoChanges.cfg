\* Two changes in a row: one decided in slot 0 starts an epoch at slot 2, whose members may
\* decide another in slot 2 (pending past the last slot), so a reader behind can learn both
\* at once and must ask the members of each. Simulated.
CONSTANTS
    Replicas = {1, 2, 3, 4}
    InitMembers = {1, 2, 3}
    Changes = {{2, 3, 4}, {1, 4}}
    N = 3
    LAG = 2
    ReadIds = {1}
SPECIFICATION RSpec
INVARIANTS ReadSafe MarkOrder TypeOK

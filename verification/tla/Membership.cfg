\* The smallest configuration with every case: three configured members out of four
\* replicas, and a change that removes two of them (only one old member is left), so the
\* old members can be a majority that retires. With LAG = 2, a change in slot 0 starts the
\* new epoch at slot 2 and leaves slot 1 to the old members. Checked exhaustively.
CONSTANTS
    Replicas = {1, 2, 3, 4}
    InitMembers = {1, 2, 3}
    Changes = {{3, 4}}
    N = 3
    LAG = 2
SPECIFICATION Spec
INVARIANTS ViewAgree Recoverable TypeOK

\* The smallest configuration with every case: three configured members out of four
\* replicas. One change removes two of them (only one old member is left), so the old
\* members can be a majority that retires; the other removes one and leaves three new
\* members, so a majority of them differs from a single durable copy. With LAG = 2, a
\* change in slot 0 starts the new epoch at slot 2 and leaves slot 1 to the old members.
\* Checked exhaustively.
CONSTANTS
    Replicas = {1, 2, 3, 4}
    InitMembers = {1, 2, 3}
    Changes = {{3, 4}, {2, 3, 4}}
    N = 3
    LAG = 2
SPECIFICATION Spec
INVARIANTS ViewAgree Recoverable TypeOK

\* Three replicas, two batches (batch b created by replica b, both proposers), two slots:
\* slot 0 contended between the origins' own batches, slot 1 referencing both. One replica
\* stopped for good and two crashes. Checked exhaustively, liveness included: 5.2M distinct
\* states, about 8 minutes on 4 workers.
CONSTANTS
    Replicas = {1, 2, 3}
    Batches = {1, 2}
    OriginOf <- Orig12
    Proposers = {1, 2}
    NS = 2
    Vals <- Vals2
    MaxCrash = 2
    MaxStop = 1
SPECIFICATION Spec
INVARIANTS TypeOK DecidedContentDurable
PROPERTIES ContentSpreads

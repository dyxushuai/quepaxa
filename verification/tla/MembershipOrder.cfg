\* Order changes: three replicas, all configured members; a change either keeps them (it
\* only reorders them) or drops one, and a slot not led by its leader counts a rotation.
\* With LAG = 2 and three slots, two order changes fit, so a change computed before the
\* first one must be ignored. Checked exhaustively.
CONSTANTS
    Replicas = {1, 2, 3}
    InitMembers = {1, 2, 3}
    Changes = {{1, 2, 3}, {1, 2}}
    N = 3
    LAG = 2
    Rotate = TRUE
SPECIFICATION Spec
INVARIANTS ViewAgree FreshInstalls RecoverableFast TypeOK
